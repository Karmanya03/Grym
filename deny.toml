[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
unmaintained = "workspace"
unsound = "workspace"
unused-ignored-advisory = "warn"
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "Unlicense", "CDLA-Permissive-2.0"]
confidence-threshold = 0.8
unused-allowed-license = "warn"

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
