[workspace]
resolver = "3"
members = [
  "crates/grym-core",
  "crates/grym-cli",
  "crates/grym-template-engine",
  "crates/grym-recon-passive",
  "crates/grym-recon-active",
  "crates/grym-web-scanner",
  "crates/grym-oob-server",
  "crates/grym-cve-intel",
  "crates/grym-binary-analysis",
  "crates/grym-mobile-analysis",
  "crates/grym-fuzz-harness",
  "crates/grym-stealth",
  "crates/grym-plugin-runtime",
  "crates/grym-storage",
  "crates/grym-report",
  "crates/grym-dashboard",
  "crates/grym-tui",
  "crates/grym-ai-agent",
  "xtask",
]
default-members = ["crates/grym-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
authors = ["GRYM contributors"]
repository = "https://github.com/Karmanya03/Grym"
homepage = "https://example.invalid/grym"
description = "Scope-enforced security assessment platform for explicitly authorized engagements."
keywords = ["security", "assessment", "scope", "rust"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
axum = "0.8.8"
bytes = "1.11.1"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive", "env"] }
futures-util = "0.3.32"
governor = "0.10.4"
ipnet = { version = "2.12.0", features = ["serde"] }
regex = "1.12.3"
reqwest = { version = "0.13.4", default-features = false, features = ["http2", "charset", "rustls", "system-proxy", "stream", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["fs", "macros", "rt-multi-thread", "sync", "time", "process"] }
toml = "0.9.11"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.22.0", features = ["serde", "v7"] }

# TUI dependencies
ratatui = "0.29"
crossterm = "0.28"
syntect = "5.2"
tokio-stream = "0.1"
tui-big-text = "0.6"

# DNS / Network
hickory-resolver = "0.25"
hickory-proto = "0.25"
trust-dns-proto = "0.25"
data-encoding = "2.6"
base64 = "0.22"
sha1 = "0.10"
hmac = "0.12"
hex = "0.4"

# Binary analysis
goblin = "0.9"


[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"
unused_crate_dependencies = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
debug = 1
incremental = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
overflow-checks = true

[profile.ci]
inherits = "dev"
incremental = false
debug = 0
